# Publishing a release: push a tag matching package.json (e.g. v0.0.1).
# Tests run on both release platforms, then binaries are cross-compiled and
# attached to the GitHub release for that tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Cross-compile binaries
        run: |
          bun build src/cli.ts --compile --target=bun-darwin-arm64 --outfile dist/list-tokens-darwin-arm64
          bun build src/cli.ts --compile --target=bun-linux-arm64 --outfile dist/list-tokens-linux-arm64
          bun build src/cli.ts --compile --target=bun-linux-x64 --outfile dist/list-tokens-linux-x64
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/list-tokens-darwin-arm64
            dist/list-tokens-linux-arm64
            dist/list-tokens-linux-x64
          generate_release_notes: true
